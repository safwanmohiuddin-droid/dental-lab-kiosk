<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Material kiosk{% endblock %}</title>
  <style>
    /* Minimal placeholder styles; the kiosk screens phase owns the real design. */
    body { font: 18px/1.4 system-ui, sans-serif; margin: 0 auto; max-width: 32rem; padding: 1rem; }
    input, button, select { font-size: 1rem; min-height: 44px; box-sizing: border-box; }
    input[type=password], input[type=text] { width: 100%; padding: .5rem; }
    button, .button { display: block; width: 100%; padding: .6rem; margin: .4rem 0; }
    .error { color: #b00020; }
    ul.people { list-style: none; padding: 0; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
