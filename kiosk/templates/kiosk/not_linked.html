{% extends "kiosk/base.html" %}
{% block content %}
<h1>Not linked to an employee</h1>
<p>You are signed in as <strong>{{ request.user.get_username }}</strong>, but this account is not
linked to an employee, so it can't take materials.</p>
<p>An admin can link it under Admin, Employees, User.</p>
<form method="post" action="{% url 'kiosk:sign_out' %}">
  {% csrf_token %}
  <button type="submit">Sign out</button>
</form>
{% endblock %}
