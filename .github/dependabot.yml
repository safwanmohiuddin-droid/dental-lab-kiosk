version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Django LTS line (ADR 0002); move majors on purpose, not by bot.
      - dependency-name: django
        update-types: ["version-update:semver-major"]
