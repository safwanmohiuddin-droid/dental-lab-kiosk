version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Django LTS line (ADR 0002); move majors on purpose, not by bot.
      - dependency-name: django
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image must match requires-python (3.13); a Python upgrade is a deliberate change.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
