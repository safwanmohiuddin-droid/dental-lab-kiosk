name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the kiosk on ...
2. Scan ...
3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: input
    id: device
    attributes:
      label: Device and browser (for kiosk problems)
