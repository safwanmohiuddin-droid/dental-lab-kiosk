[project]
name = "dental-lab-kiosk"
version = "0.0.0"
description = "Barcode material-issuing kiosk for dental labs"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "django>=5.2,<5.3",
    "django-environ>=0.12",
    "django-otp>=1.7.5",
    "gunicorn>=27.0.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "qrcode>=8.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--reuse-db"
# WhiteNoise: staticfiles/ only exists after collectstatic (Docker image), not in tests.
filterwarnings = ["ignore:No directory at:UserWarning"]
