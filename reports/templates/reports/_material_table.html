<div class="table"><table>
  <thead><tr><th>Material</th><th>Unit</th><th class="num">Used</th><th class="num">Cost</th><th class="num">Times taken</th><th class="num">Has a price</th><th></th></tr></thead>
  <tbody>
  {% for r in rows %}

  {% endfor %}
  </tbody>
</table></div>
