# Production: docker compose -f compose.prod.yaml up -d --build
# Settings come from .env next to this file (copy .env.prod.example). See docs/operations.md.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kiosk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kiosk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DEBUG: "False"
      ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      DATABASE_URL: postgres://${POSTGRES_USER:-kiosk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kiosk}
      TIME_ZONE: ${TIME_ZONE:-UTC}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
